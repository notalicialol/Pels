image: node:20

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  before_script:
    - cd frontend
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm -v
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

  script:
    - pnpm build
    - rm -rf public
    - mv dist public
    - cp -r dist/. ../public/

  artifacts:
    paths:
      - public

cache:
  key: pnpm
  paths:
    - .pnpm-store
